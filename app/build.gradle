plugins {
    id 'com.android.application'
}

// 正式发布用的签名：把 keystore.properties 放在项目根目录（已在 .gitignore 里）即可自动启用，
// 没配时 release 退回 debug 签名，保证本地能直接 build 出可安装的包。
// 注意：在线更新要求新旧 APK 签名一致，换签名后老用户必须先卸载再装。
def keystoreFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystoreFile.exists()) {
    keystoreProps.load(new FileInputStream(keystoreFile))
}

android {
    namespace 'com.example.smartirrigation'
    compileSdk 35
    buildToolsVersion "35.0.1"

    buildFeatures {
        // 设置页「关于」要展示构建日期与版本
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.example.smartirrigation'
        minSdk 24
        targetSdk 34
        // 每次发版必须同时 +1：在线更新靠 versionName 判断新旧，versionCode 供系统覆盖安装校验
        versionCode 2
        versionName '1.1'

        // 每次构建自动写入当天日期
        buildConfigField "String", "BUILD_DATE", "\"${new Date().format('yyyy-MM-dd')}\""
    }

    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 没有自己的密钥时用 debug 签名，保证 GitHub 上下的包能直接覆盖安装
            signingConfig keystoreFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // 网络：Retrofit + OkHttp + Gson
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.11.0'

    // 历史曲线图表（纯 Java View 库）
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
}
